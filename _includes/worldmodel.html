<!-- _includes/worldmodel.html -->
<!-- Self-contained: styles are scoped under .wm-page, and the runtime script
     is only requested on the page that includes this partial. -->
<div class="wm-page">
  <div class="wm-card">
    <canvas id="wm-canvas" aria-label="Tiny neural world model demo"></canvas>
    <div class="wm-hud">
      <span>drift from reality: <strong id="wm-drift">0.000</strong></span>
    </div>
  </div>

  <div class="wm-controls">
    <div class="wm-dpad" aria-hidden="false">
      <button class="wm-btn" data-action="1" aria-label="Up">↑</button>
      <div class="wm-dpad-row">
        <button class="wm-btn" data-action="3" aria-label="Left">←</button>
        <button class="wm-btn" data-action="2" aria-label="Down">↓</button>
        <button class="wm-btn" data-action="4" aria-label="Right">→</button>
      </div>
    </div>
    <div class="wm-buttons">
      <button id="wm-toggle-mode" class="wm-action-btn">Mode: solo</button>
      <button id="wm-toggle-truth" class="wm-action-btn" aria-pressed="false">Show ground truth</button>
      <button id="wm-toggle-ground" class="wm-action-btn" aria-pressed="true">Guidance: on</button>
      <button id="wm-reset" class="wm-action-btn">Reset</button>
    </div>
  </div>

  <p class="wm-status">Model status: <span id="wm-status">loading…</span></p>
</div>

<style>
.wm-page {
  margin-top: 0.5rem;
}
.wm-card {
  position: relative;
  width: 100%;
  max-width: 480px;
  aspect-ratio: 4 / 3;
  margin: 0 auto;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--global-divider-color);
  background:
    radial-gradient(120% 140% at 15% 0%, rgba(var(--global-theme-rgb, 79, 70, 229), 0.10) 0%, rgba(var(--global-theme-rgb, 79, 70, 229), 0) 55%),
    var(--global-card-bg-color);
}
#wm-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
}
.wm-hud {
  position: absolute;
  left: 10px;
  bottom: 8px;
  font-size: 0.78rem;
  color: var(--global-text-color-light);
  background: var(--global-bg-color);
  border: 1px solid var(--global-divider-color);
  border-radius: 6px;
  padding: 2px 8px;
  opacity: 0.9;
}

.wm-controls {
  max-width: 480px;
  margin: 1rem auto 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
}
.wm-dpad {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  user-select: none;
}
.wm-dpad-row {
  display: flex;
  gap: 4px;
}
.wm-btn {
  width: 40px;
  height: 40px;
  border-radius: 8px;
  border: 1px solid var(--global-divider-color);
  background: var(--global-card-bg-color);
  color: var(--global-text-color);
  font-size: 1.1rem;
  cursor: pointer;
  touch-action: none;
}
.wm-btn:active {
  background: var(--global-theme-color);
  color: white;
}
.wm-buttons {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
}
.wm-action-btn {
  border: 1px solid var(--global-text-color);
  background: transparent;
  color: var(--global-text-color);
  border-radius: 4px;
  padding: 0.4rem 0.8rem;
  font-size: 0.85rem;
  cursor: pointer;
}
.wm-action-btn:hover, .wm-action-btn[aria-pressed="true"] {
  color: var(--global-theme-color);
  border-color: var(--global-theme-color);
}
.wm-status {
  max-width: 480px;
  margin: 0.75rem auto 0;
  font-size: 0.8rem;
  color: var(--global-text-color-light);
  text-align: center;
}
@media (max-width: 480px) {
  .wm-controls { justify-content: center; }
}
</style>

<script src="{{ '/assets/js/worldmodel.js' | relative_url }}" defer></script>
