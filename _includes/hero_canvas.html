<!-- _includes/hero_canvas.html -->
<!-- Lightweight, dependency-free interactive banner: a few small teams of
     agents flocking over a faint grid world. Each team aligns with its own
     members but keeps its distance from everyone, and nearby agents steer
     toward the cursor. A small nod to the multiplayer world models I work on.
     Renders one still frame if the user prefers reduced motion, and pauses
     when off-screen or in a hidden tab. -->
<div class="hero-canvas-wrap" aria-hidden="true">
  <canvas id="hero-canvas"></canvas>
  <span class="hero-hint">move your cursor, the agents will follow</span>
</div>

<script>
(function () {
  var wrap = document.querySelector('.hero-canvas-wrap');
  var canvas = document.getElementById('hero-canvas');
  if (!wrap || !canvas || !canvas.getContext) return;

  var prefersReduced = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (window.matchMedia && window.matchMedia('(hover: none)').matches) {
    wrap.querySelector('.hero-hint').textContent = 'touch and drag, the agents will follow';
  }

  var ctx = canvas.getContext('2d');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var W = 0, H = 0, agents = [], raf = null, last = 0, acc = 0;
  var visible = true;
  var pointer = { x: 0, y: 0, active: false };

  // one colour per team: light and dark-theme variants
  var PALETTE = {
    light: ['79,70,229', '14,165,233', '168,85,247', '244,114,182'],
    dark:  ['165,180,252', '125,211,252', '216,180,254', '249,168,212']
  };
  var colors = PALETTE.light;
  function readTheme() {
    colors = document.documentElement.getAttribute('data-theme') === 'dark'
      ? PALETTE.dark : PALETTE.light;
  }

  var TRAIL = 22;          // positions kept per agent
  var VIEW = 62;           // neighbour radius (px)
  var SPACE = 24;          // personal space (px)
  var PULL = 150;          // cursor influence radius (px)
  var MAX_SPEED = 1.5, MIN_SPEED = 0.55;

  function resize() {
    W = wrap.clientWidth;
    H = wrap.clientHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function seed() {
    var count = Math.round(Math.min(72, Math.max(28, W / 11)));
    var teams = colors.length;
    agents = [];
    for (var i = 0; i < count; i++) {
      var team = i % teams;
      // start each team loosely clustered and heading the same way
      var cx = ((team + 0.5) / teams) * W, cy = H / 2;
      var heading = (team / teams) * Math.PI * 2 + 0.6;
      var a = heading + (Math.random() - 0.5) * 0.8;
      var x = cx + (Math.random() - 0.5) * W / teams;
      var y = cy + (Math.random() - 0.5) * H * 0.8;
      agents.push({ x: x, y: y, vx: Math.cos(a), vy: Math.sin(a), team: team, trail: [] });
    }
  }

  function wrapDelta(d, size) {
    if (d > size / 2) return d - size;
    if (d < -size / 2) return d + size;
    return d;
  }

  function update() {
    for (var i = 0; i < agents.length; i++) {
      var p = agents[i];
      var ax = 0, ay = 0, cx = 0, cy = 0, n = 0, sx = 0, sy = 0;
      for (var j = 0; j < agents.length; j++) {
        if (i === j) continue;
        var q = agents[j];
        var dx = wrapDelta(q.x - p.x, W), dy = wrapDelta(q.y - p.y, H);
        var d2 = dx * dx + dy * dy;
        if (d2 < SPACE * SPACE && d2 > 0) {
          var d = Math.sqrt(d2);
          sx -= dx / d * (SPACE - d) / SPACE;
          sy -= dy / d * (SPACE - d) / SPACE;
        }
        if (q.team === p.team && d2 < VIEW * VIEW) {
          ax += q.vx; ay += q.vy; cx += dx; cy += dy; n++;
        }
      }
      if (n) {
        p.vx += (ax / n - p.vx) * 0.035 + (cx / n) * 0.0012;
        p.vy += (ay / n - p.vy) * 0.035 + (cy / n) * 0.0012;
      }
      p.vx += sx * 0.06;
      p.vy += sy * 0.06;

      // gentle wander so flocks never freeze into straight lines
      p.vx += (Math.random() - 0.5) * 0.04;
      p.vy += (Math.random() - 0.5) * 0.04;

      if (pointer.active) {
        var px = pointer.x - p.x, py = pointer.y - p.y;
        var pd = Math.sqrt(px * px + py * py) || 1;
        if (pd < PULL) {
          var f = 0.05 * (1 - pd / PULL) + 0.02;
          p.vx += (px / pd) * f;
          p.vy += (py / pd) * f;
        }
      }

      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
      var lim = pointer.active ? MAX_SPEED * 1.35 : MAX_SPEED;
      if (sp > lim) { p.vx *= lim / sp; p.vy *= lim / sp; }
      else if (sp < MIN_SPEED) { p.vx *= MIN_SPEED / sp; p.vy *= MIN_SPEED / sp; }

      p.x += p.vx; p.y += p.vy;
      var wrapped = false;
      if (p.x < 0) { p.x += W; wrapped = true; } else if (p.x > W) { p.x -= W; wrapped = true; }
      if (p.y < 0) { p.y += H; wrapped = true; } else if (p.y > H) { p.y -= H; wrapped = true; }
      if (wrapped) p.trail.length = 0;   // don't draw a streak across the banner
      p.trail.push(p.x, p.y);
      if (p.trail.length > TRAIL * 2) p.trail.splice(0, 2);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.lineCap = 'butt';

    if (pointer.active) {
      var g = ctx.createRadialGradient(pointer.x, pointer.y, 0, pointer.x, pointer.y, PULL);
      g.addColorStop(0, 'rgba(' + colors[0] + ',0.10)');
      g.addColorStop(1, 'rgba(' + colors[0] + ',0)');
      ctx.fillStyle = g;
      ctx.fillRect(pointer.x - PULL, pointer.y - PULL, PULL * 2, PULL * 2);
    }

    for (var i = 0; i < agents.length; i++) {
      var p = agents[i], t = p.trail, c = colors[p.team];
      // fading trail
      ctx.strokeStyle = 'rgb(' + c + ')';
      ctx.lineWidth = 1.2;
      var segs = t.length / 2 - 1;
      for (var k = 0; k < segs; k++) {
        ctx.globalAlpha = 0.3 * (k + 1) / segs;
        ctx.beginPath();
        ctx.moveTo(t[k * 2], t[k * 2 + 1]);
        ctx.lineTo(t[k * 2 + 2], t[k * 2 + 3]);
        ctx.stroke();
      }
      // the agent: a small arrowhead pointing where it's going
      var sp = Math.sqrt(p.vx * p.vx + p.vy * p.vy) || 1;
      var ux = p.vx / sp, uy = p.vy / sp;
      ctx.globalAlpha = 0.95;
      ctx.fillStyle = 'rgb(' + c + ')';
      ctx.beginPath();
      ctx.moveTo(p.x + ux * 4, p.y + uy * 4);
      ctx.lineTo(p.x - ux * 2.6 - uy * 2.2, p.y - uy * 2.6 + ux * 2.2);
      ctx.lineTo(p.x - ux * 1.2, p.y - uy * 1.2);
      ctx.lineTo(p.x - ux * 2.6 + uy * 2.2, p.y - uy * 2.6 - ux * 2.2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  // fixed 60 Hz simulation so speed is the same on 60 and 120 Hz screens
  function frame(now) {
    if (!last) last = now;
    acc = Math.min(acc + (now - last), 50);
    last = now;
    while (acc >= 16.67) { update(); acc -= 16.67; }
    draw();
    raf = requestAnimationFrame(frame);
  }

  function run() {
    if (raf || prefersReduced || !visible || document.hidden) return;
    last = 0; acc = 0;
    raf = requestAnimationFrame(frame);
  }
  function pause() {
    if (raf) cancelAnimationFrame(raf);
    raf = null;
  }

  function pointFromEvent(e) {
    var r = canvas.getBoundingClientRect();
    var t = e.touches ? e.touches[0] : e;
    pointer.x = t.clientX - r.left;
    pointer.y = t.clientY - r.top;
    pointer.active = true;
  }
  wrap.addEventListener('mousemove', pointFromEvent);
  wrap.addEventListener('touchstart', pointFromEvent, { passive: true });
  wrap.addEventListener('touchmove', pointFromEvent, { passive: true });
  wrap.addEventListener('mouseleave', function () { pointer.active = false; });
  wrap.addEventListener('touchend', function () { pointer.active = false; });

  function start() {
    readTheme();
    resize();
    seed();
    // let the flocks form before the first frame is shown
    for (var i = 0; i < 240; i++) update();
    draw();
    pause();
    run();
  }

  var rt, lastW = 0;
  window.addEventListener('resize', function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      if (wrap.clientWidth !== lastW) { lastW = wrap.clientWidth; start(); }
    }, 150);
  });
  // swap palettes when the light/dark theme is toggled
  new MutationObserver(function () { readTheme(); if (!raf) draw(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pause(); else run();
  });
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      visible = entries[0].isIntersecting;
      if (visible) run(); else pause();
    }).observe(wrap);
  }

  lastW = wrap.clientWidth;
  start();
})();
</script>
